name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7cf5c8&color_dots=#ebedf0,#9be9c8,#5fd3a6,#2fae7f,#0f7a55
            dist/snake-dark.svg?palette=github-dark&color_snake=#7cf5c8&color_dots=#161b22,#0f3d33,#1f7a63,#4fd1a5,#7cf5c8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
